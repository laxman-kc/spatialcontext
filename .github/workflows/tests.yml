name: CPU tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - name: Configure isolated model cache
        run: echo "HF_HOME=$RUNNER_TEMP/ecqa-huggingface" >> "$GITHUB_ENV"
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check installed package
        run: |
          python -m pip check
          ecqa --help
      - name: Lint
        run: python -m ruff check ecqa tests scripts
      - name: Test with synthetic fixtures
        run: python -m pytest -q
      - name: Verify saved result snapshots
        run: |
          python scripts/inspect_results.py
          python scripts/inspect_memory_results.py
          python scripts/inspect_memory_results.py --root results/memory-reader
      - name: Check Git media exclusions
        run: |
          python - <<'PY'
          import subprocess
          excluded = {
              "results/video-demo/walkthrough.mp4",
              "results/video-demo/preview.gif",
              "results/video-demo/poster.png",
          }
          tracked = set(subprocess.check_output(["git", "ls-files"], text=True).splitlines())
          assert not tracked & excluded, "Demo media must stay out of Git; the authorized recording is a README attachment"
          PY
      - name: Build and test the source distribution
        run: |
          python -m pip install 'build>=1,<2'
          python -m build
          ECQA_SDIST_TMP="$(mktemp -d)"
          tar -xzf dist/*.tar.gz -C "$ECQA_SDIST_TMP"
          cd "$ECQA_SDIST_TMP"/*
          python -m pytest -q
          python scripts/inspect_results.py
          python scripts/inspect_memory_results.py
          python scripts/inspect_memory_results.py --root results/memory-reader
