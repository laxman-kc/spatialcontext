[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "earlier-clip-qa"
version = "0.1.0"
requires-python = ">=3.10"
description = "Offline earlier-clip spatial QA research pilot"
readme = "README.md"
# Aggregate release terms; NOTICE.md identifies the scope of each license.
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "NOTICE.md", "LICENSES/*.txt"]
dependencies = ["numpy>=2.0,<3", "Pillow>=12,<13", "PyYAML>=6,<7", "av>=13,<14", "huggingface_hub>=0.36,<1"]

[project.optional-dependencies]
gpu = ["torch==2.6.0", "torchvision==0.21.0", "transformers==4.57.1", "peft==0.18.1", "accelerate==1.12.0"]
dev = ["pytest==8.4.2", "ruff==0.13.0"]

[project.scripts]
ecqa = "ecqa.cli:main"

[tool.setuptools.packages.find]
include = ["ecqa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: explicit NVIDIA GPU and provisioned model required"]

[tool.ruff]
line-length = 110
target-version = "py310"
